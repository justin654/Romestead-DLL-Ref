<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Romestead Assembly Reference</title>
  <style>
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #11150f;
      color: #f3ead7;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }

    main {
      max-width: 680px;
      padding: 48px 28px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: 0.95;
      margin: 0 0 20px;
    }

    p {
      color: #cfc3aa;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 0 14px;
    }

    code {
      background: #242a1d;
      border: 1px solid #3b452f;
      border-radius: 6px;
      color: #f6d97a;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Romestead Assembly Reference</h1>
    <p>The GitHub Pages deploy path is ready.</p>
    <p>Generate a catalog locally, run <code>scripts\publish_latest_to_docs.bat</code>, commit the updated <code>docs/</code> folder, and push to publish the real reference site.</p>
  </main>
</body>
</html>
